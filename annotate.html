<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanoVerse — Pose Selection</title>
<style>
  :root {
    --ink: #14140f;
    --paper: #e9e4d8;
    --panel: #f6f3ea;
    --line: #c9c1ac;
    --pick: #3b6e47;
    --pick-soft: #dcebdf;
    --gt: #b5722a;
    --miss: #9a3b34;
    --mut: #6b6455;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 22px 28px 16px; border-bottom: 2px solid var(--ink);
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; font-weight: 700; }
  h1 small { font-weight: 400; color: var(--mut); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; margin-left: 10px; }
  .counter { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--mut); }
  .load-row {
    padding: 14px 28px; border-bottom: 1px solid var(--line);
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13px;
  }
  .load-row label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=file] { font: inherit; font-size: 12px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 26px 28px 90px; }
  .stage {
    display: grid; grid-template-columns: 260px 1fr; gap: 30px; align-items: start;
  }
  .ref { position: sticky; top: 20px; }
  .ref h2, .cand-head {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut);
    margin: 0 0 10px; font-weight: 700; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .ref-img, .cand img {
    width: 100%; display: block; background:
      repeating-conic-gradient(#eeeae0 0% 25%, #f6f3ea 0% 50%) 50% / 22px 22px;
    border: 1px solid var(--line);
  }
  .ref-frame { border: 2px solid var(--ink); padding: 6px; background: var(--panel); }
  .ref-cap { font-size: 12px; color: var(--mut); margin-top: 8px; line-height: 1.4; }
  .uid { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--mut); word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cand {
    border: 1px solid var(--line); background: var(--panel); padding: 8px;
    cursor: pointer; transition: transform .08s ease, border-color .08s ease, box-shadow .08s ease;
    position: relative;
  }
  .cand:hover { border-color: var(--ink); transform: translateY(-2px); }
  .cand.picked { border: 2px solid var(--pick); background: var(--pick-soft); box-shadow: 0 3px 0 var(--pick); }
  .cand .tag {
    position: absolute; top: 12px; left: 12px; font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; background: var(--ink); color: var(--paper); padding: 2px 6px; letter-spacing: .03em;
  }
  .cand .keyhint {
    position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; line-height: 20px;
    text-align: center; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    background: var(--paper); border: 1px solid var(--line); color: var(--mut);
  }
  .cand.picked .keyhint { background: var(--pick); color: #fff; border-color: var(--pick); }
  .actions {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 2px solid var(--ink); padding: 12px 28px;
    display: flex; align-items: center; gap: 14px; justify-content: space-between;
  }
  .actions .hint { font-size: 12px; color: var(--mut); }
  button {
    font: inherit; font-size: 14px; padding: 9px 18px; border: 1.5px solid var(--ink);
    background: var(--paper); color: var(--ink); cursor: pointer; letter-spacing: .01em;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button.primary { background: var(--pick); border-color: var(--pick); color: #fff; }
  button.primary:hover { background: #2f5939; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:disabled:hover { background: var(--paper); color: var(--ink); }
  .agree { font-size: 12px; margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }
  .agree.match { color: var(--pick); }
  .agree.diff { color: var(--gt); }
  .empty { padding: 60px 0; text-align: center; color: var(--mut); }
  .flag { margin-left: auto; }
  .flag label { font-size: 12px; color: var(--miss); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>CanoVerse <small>Pose Selection</small></h1>
  <div class="counter" id="counter">no manifest loaded</div>
</header>

<div class="load-row">
  <label>manifest.json <input type="file" id="manifestInput" accept="application/json"></label>
  <label>render folder <input type="file" id="folderInput" webkitdirectory directory multiple></label>
  <span class="hint" style="color:var(--mut);font-size:12px">Load the manifest, then select the same category's render folder so images resolve.</span>
</div>

<div class="wrap">
  <div id="stageHost">
    <div class="empty">Load a <code>manifest.json</code> produced by <code>generate_candidates.py</code> to begin.</div>
  </div>
</div>

<div class="actions">
  <div class="hint">Keys: <b>1–5</b> select · <b>←/→</b> prev/next · <b>Enter</b> confirm &amp; advance</div>
  <div class="flag">
    <label><input type="checkbox" id="discardBox"> discard (bad mesh / none correct)</label>
  </div>
  <div style="display:flex; gap:10px">
    <button id="prevBtn">&larr; Prev</button>
    <button id="nextBtn" class="primary">Confirm &amp; Next &rarr;</button>
    <button id="exportBtn">Export labels</button>
  </div>
</div>

<script>
const state = {
  manifest: null,
  files: {},        // relative path -> object URL
  idx: 0,
  picks: {},        // uid -> {index, name, discard}
  showGT: true,     // reveal ground-truth agreement after picking (for QA)
};

function rotAngleDiff(A, B) {
  // geodesic angle between two 3x3 rotation matrices, in degrees
  let tr = 0;
  for (let i=0;i<3;i++) for (let j=0;j<3;j++) tr += A[i][j]*B[i][j]; // trace(A^T B) via elementwise since orthonormal rows
  // above computes sum A_ij B_ij = trace(A^T B)
  let c = (tr - 1) / 2;
  c = Math.max(-1, Math.min(1, c));
  return Math.acos(c) * 180 / Math.PI;
}

document.getElementById('manifestInput').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  state.manifest = JSON.parse(await f.text());
  state.idx = 0; state.picks = {};
  render();
});

document.getElementById('folderInput').addEventListener('change', (e) => {
  state.files = {};
  for (const f of e.target.files) {
    // webkitRelativePath looks like "table/<uid>/cand_0.png"; strip leading category dir
    const parts = f.webkitRelativePath.split('/');
    const rel = parts.slice(1).join('/'); // drop top folder to match manifest's "<uid>/cand_i.png"
    state.files[rel] = URL.createObjectURL(f);
    state.files[f.webkitRelativePath] = URL.createObjectURL(f);
  }
  render();
});

function resolveImg(rel) {
  return state.files[rel] || state.files[(state.manifest?.category||'')+'/'+rel] || '';
}

function render() {
  const host = document.getElementById('stageHost');
  if (!state.manifest) return;
  const objs = state.manifest.objects;
  const obj = objs[state.idx];
  document.getElementById('counter').textContent =
    `object ${state.idx+1} / ${objs.length}  ·  ${Object.keys(state.picks).length} labeled`;

  const pick = state.picks[obj.uid];
  const tplSrc = resolveImg(state.manifest.template);

  host.innerHTML = `
    <div class="stage">
      <aside class="ref">
        <h2>Reference (canonical)</h2>
        <div class="ref-frame"><img class="ref-img" src="${tplSrc}" alt="template"></div>
        <div class="ref-cap">Pick the candidate whose orientation matches this reference.</div>
        <div class="ref-cap uid">${obj.uid}</div>
        <div id="agree"></div>
      </aside>
      <section>
        <div class="cand-head">Candidates — click or press 1–5</div>
        <div class="grid" id="grid"></div>
      </section>
    </div>`;

  const grid = host.querySelector('#grid');
  obj.candidates.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'cand' + (pick && pick.index === c.index ? ' picked' : '');
    el.innerHTML = `
      <span class="tag">${c.name}</span>
      <span class="keyhint">${i+1}</span>
      <img src="${resolveImg(c.image)}" alt="candidate ${i+1}">`;
    el.addEventListener('click', () => choose(c));
    grid.appendChild(el);
  });

  document.getElementById('discardBox').checked = !!(pick && pick.discard);
  updateAgreement();
}

function choose(c) {
  const obj = state.manifest.objects[state.idx];
  state.picks[obj.uid] = { index: c.index, name: c.name, discard: false, rotation: c.rotation };
  document.getElementById('discardBox').checked = false;
  render();
}

function updateAgreement() {
  const box = document.getElementById('agree');
  if (!box) return;
  const obj = state.manifest.objects[state.idx];
  const pick = state.picks[obj.uid];
  if (!state.showGT || !pick || pick.discard || !obj.ground_truth) { box.innerHTML=''; return; }
  const diff = rotAngleDiff(pick.rotation, obj.ground_truth);
  const match = diff <= 15;
  box.className = 'agree ' + (match ? 'match' : 'diff');
  box.textContent = match
    ? `✓ agrees with stored label (${diff.toFixed(1)}°)`
    : `Δ ${diff.toFixed(1)}° from stored label`;
}

document.getElementById('discardBox').addEventListener('change', (e) => {
  const obj = state.manifest.objects[state.idx];
  state.picks[obj.uid] = { index: -1, name: 'DISCARD', discard: e.target.checked };
  render();
});

document.getElementById('nextBtn').addEventListener('click', () => advance(1));
document.getElementById('prevBtn').addEventListener('click', () => advance(-1));
function advance(dir) {
  const n = state.manifest.objects.length;
  state.idx = Math.max(0, Math.min(n-1, state.idx + dir));
  render();
}

document.addEventListener('keydown', (e) => {
  if (!state.manifest) return;
  if (e.key >= '1' && e.key <= '5') {
    const obj = state.manifest.objects[state.idx];
    const c = obj.candidates[parseInt(e.key,10)-1];
    if (c) choose(c);
  } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
    advance(1);
  } else if (e.key === 'ArrowLeft') {
    advance(-1);
  }
});

document.getElementById('exportBtn').addEventListener('click', () => {
  if (!state.manifest) return;
  const out = { category: state.manifest.category, labels: {} };
  for (const obj of state.manifest.objects) {
    const p = state.picks[obj.uid];
    if (!p) continue;
    out.labels[obj.uid] = p.discard
      ? { discard: true }
      : { selected_index: p.index, selected_name: p.name, rotation: p.rotation };
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${state.manifest.category}_labels.json`;
  a.click();
});
</script>
</body>
</html>
